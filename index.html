<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HmNova Cuisine</title>
  <meta name="description" content="HmNova Cuisine demo restaurant website.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=El+Messiri:wght@500;700&family=Fraunces:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
/* ===== 1. Design system: edit this block to re-theme ===== */
:root {
  --cream: #F6EFE4;  --espresso: #1B1410;  --saffron: #F2A900;  --terracotta: #C2512B;
  --saffron-text: #8A5A00;            /* darker saffron, readable on cream */
  --tint: #EDE3D2;  --paper: #FFFAF2;  --line: #DDD0BD;  --muted: #5E5248;

  --font-head-en: "Fraunces", Georgia, serif;
  --font-body-en: "DM Sans", system-ui, sans-serif;
  --font-head-ar: "El Messiri", "Segoe UI", sans-serif;
  --font-body-ar: "Cairo", "Segoe UI", sans-serif;
  --font-head: var(--font-head-en);
  --font-body: var(--font-body-en);

  --space-1: .5rem; --space-2: 1rem; --space-3: 1.5rem; --space-4: 2.5rem; --space-5: 4rem; --space-6: 6rem;
  --radius: 18px;  --radius-sm: 10px;  --max: 1160px;
  --text-m: 1.0625rem;  --text-l: 1.25rem;
  --text-h2: clamp(2rem, 6vw, 3.25rem);
  --text-h1: clamp(2.6rem, 9vw, 5rem);
}
html[lang="ar"] { --font-head: var(--font-head-ar); --font-body: var(--font-body-ar); }

/* ===== 2. Base ===== */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 7rem; }
body { margin: 0; font-family: var(--font-body); font-size: var(--text-m); line-height: 1.6; color: var(--espresso); background: var(--cream); }
html[lang="ar"] body { line-height: 1.85; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; line-height: 1.12; margin: 0 0 var(--space-2); }
html[lang="ar"] :is(h1, h2, h3) { line-height: 1.4; }
h1 { font-size: var(--text-h1); }
h2 { font-size: var(--text-h2); }
h3 { font-size: var(--text-l); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--terracotta); outline-offset: 3px; }
.dark :focus-visible { outline-color: var(--saffron); }
.wrap { width: min(100% - 3rem, var(--max)); margin-inline: auto; }
.skip { position: absolute; inset-inline-start: -999px; }
.skip:focus { inset-inline-start: var(--space-2); top: var(--space-1); z-index: 20; background: var(--saffron); padding: .5rem 1rem; }

/* One headline style: italic accent in English, color + weight in Arabic */
em.accent { font-style: italic; color: var(--saffron-text); }
.dark em.accent { color: var(--saffron); }
html[lang="ar"] em.accent { font-style: normal; font-weight: 700; }

/* ===== 3. Buttons ===== */
.btn, .toggle { font: inherit; font-weight: 700; display: inline-block; padding: .8rem 1.5rem; border-radius: 999px; border: 2px solid transparent; text-decoration: none; cursor: pointer; }
.btn--primary { background: var(--saffron); color: var(--espresso); }
.btn--primary:hover { background: #FFBE2E; }
.btn--ghost { border-color: currentColor; background: none; color: inherit; }
.toggle { padding: .5rem 1rem; background: none; color: var(--espresso); border-color: var(--espresso); }
.btns { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-block-start: var(--space-3); }

/* ===== 4. Header, menu drawer, hero, motion ===== */
:root { --ease: cubic-bezier(.2,.7,.2,1); --gold: linear-gradient(120deg, #E69B00, #FFD770 50%, #F2A900); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
@keyframes drift { to { transform: translate3d(-6vmax, 5vmax, 0) scale(1.15); } }
@keyframes zoom { to { transform: scale(1.1); } }
@keyframes cue { 0% { transform: scaleY(0); } 55% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
@keyframes slide { to { transform: translateX(-50%); } }
@keyframes grow { from { width: 0; } }
.reveal { opacity: 0; }
.reveal.is-in { opacity: 1; animation: rise .9s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
[data-in] { animation: rise 1s var(--ease) backwards; animation-delay: calc(var(--d, 0) * 1ms); }

.btn, .toggle { text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; transition: transform .3s var(--ease), box-shadow .3s, background-position .6s, border-color .3s, color .3s; }
.btn--primary, .btn--primary:hover { background-image: var(--gold); background-size: 200% 100%; }
.btn--primary:hover { background-position: 100% 0; transform: translateY(-2px); box-shadow: 0 12px 28px -10px rgba(242,169,0,.6); }
.btn--ghost:hover, .toggle:hover { border-color: var(--saffron); color: var(--saffron); }
.toggle { color: var(--cream); border-color: rgba(246,239,228,.3); padding: .5rem .9rem; }

.header { position: fixed; inset-inline: 0; top: 0; z-index: 30; color: var(--cream); transition: background .4s, box-shadow .4s; }
.header.is-scrolled { background: rgba(27,20,16,.9); backdrop-filter: blur(14px); box-shadow: 0 1px 0 rgba(242,169,0,.2); }
.header :focus-visible, .drawer :focus-visible { outline-color: var(--saffron); }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-2); padding-block: 1.25rem; transition: padding .4s var(--ease); }
.is-scrolled .bar { padding-block: .65rem; }
.wordmark { font-family: var(--font-head); font-size: 1.45rem; font-weight: 600; text-decoration: none; }
.actions { justify-self: end; display: flex; align-items: center; gap: .6rem; }
.header .btn { padding: .65rem 1.2rem; }
.header .btn--ghost, .hero .btn--ghost { border-color: rgba(246,239,228,.3); background: rgba(27,20,16,.35); backdrop-filter: blur(6px); }

.burger { justify-self: start; display: inline-flex; align-items: center; gap: .9rem; background: none; border: 0; color: inherit; font: inherit; font-weight: 600; font-size: .85rem; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; padding: .5rem 0; }
.burger__ico { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.burger__ico i { display: block; height: 1.5px; background: var(--saffron); transition: width .35s var(--ease), transform .45s var(--ease), opacity .3s; }
.burger__ico i:nth-child(1) { width: 40px; } .burger__ico i:nth-child(2) { width: 28px; } .burger__ico i:nth-child(3) { width: 18px; }
.burger:hover .burger__ico i { width: 40px; }
.burger.is-open .burger__ico i { width: 30px; }
.burger.is-open i:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
.burger.is-open i:nth-child(2) { opacity: 0; }
.burger.is-open i:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

.drawer { position: fixed; inset: 0; z-index: 25; background: var(--espresso); color: var(--cream); display: grid; align-content: center; padding-block: 6rem 3rem; clip-path: inset(0 0 100% 0); visibility: hidden; transition: clip-path .7s cubic-bezier(.7,0,.2,1), visibility 0s .7s; }
.drawer.open { clip-path: inset(0); visibility: visible; transition: clip-path .7s cubic-bezier(.7,0,.2,1), visibility 0s; }
.drawer a { display: block; width: max-content; font-family: var(--font-head); font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.25; text-decoration: none; opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .6s var(--ease), color .2s; }
.drawer.open a { opacity: 1; transform: none; transition-delay: calc(.3s + var(--i, 0) * 70ms), calc(.3s + var(--i, 0) * 70ms), 0s; }
.drawer a:hover { color: var(--saffron); }
.drawer__lang { margin-block-start: var(--space-3); }

.hero { position: relative; min-height: 100svh; display: grid; place-items: center; text-align: center; overflow: hidden; background: #120C09; padding-block: 8rem 7rem; }
/* To add a photo or video poster: .hero { --hero-img: url("hero.jpg"); } */
.hero__bg { position: absolute; inset: -6%; background: linear-gradient(180deg, rgba(18,12,9,.7), rgba(18,12,9,.35) 45%, rgba(18,12,9,.9)), var(--hero-img, none) center / cover; animation: zoom 26s ease-in-out infinite alternate; }
.hero__glow { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .32; top: -22vmax; inset-inline-end: -12vmax; background: radial-gradient(circle, var(--saffron), transparent 65%); animation: drift 18s ease-in-out infinite alternate; }
.hero__glow--2 { top: auto; inset-inline-end: auto; bottom: -28vmax; inset-inline-start: -16vmax; opacity: .28; background: radial-gradient(circle, var(--terracotta), transparent 65%); animation-duration: 23s; }
.hero__in { position: relative; z-index: 1; width: min(100% - 3rem, 920px); }
.eyebrow { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 0 0 var(--space-3); color: var(--saffron); font-size: .8rem; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; }
.eyebrow::before, .eyebrow::after { content: ""; height: 1px; width: 2.6rem; background: var(--saffron); animation: grow 1.4s var(--ease) .5s backwards; }
.hero h1 { font-size: clamp(2.8rem, 8.5vw, 6.5rem); line-height: 1.05; max-width: 14ch; margin-inline: auto; }
.hero .lead { margin: 0 auto; max-width: 46ch; color: rgba(246,239,228,.82); }
.hero .btns { justify-content: center; margin-block-start: var(--space-4); }
.scroll { position: absolute; bottom: 2rem; inset-inline: 0; margin-inline: auto; width: max-content; display: grid; justify-items: center; gap: .8rem; text-decoration: none; color: rgba(246,239,228,.65); font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; }
.scroll i { width: 1px; height: 48px; background: linear-gradient(var(--saffron), transparent); transform-origin: top; animation: cue 2.4s ease-in-out infinite; }
html[lang="ar"] :is(.btn, .toggle, .burger, .eyebrow, .scroll, .tag, .tile__cap p) { letter-spacing: 0; text-transform: none; }
@media (max-width: 759px) { .hide-sm { display: none; } }
@media (max-width: 519px) {
  .toggle.hide-xs { display: none; }
  .burger__lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .header .btn { padding: .55rem 1rem; } .wordmark { font-size: 1.2rem; }
}
@media (min-width: 520px) { .drawer__lang { display: none; } }

/* ===== 5. Sections ===== */
.section { padding-block: var(--space-5); }
@media (min-width: 768px) { .section { padding-block: var(--space-6); } }
.tint { background: var(--tint); }
.dark { background: var(--espresso); color: var(--cream); }
.lead { font-size: var(--text-l); max-width: 36ch; }
.split { display: grid; gap: var(--space-4); align-items: center; }
@media (min-width: 900px) { .split { grid-template-columns: 1fr 1fr; gap: var(--space-5); } }

/* Image placeholders: swap each for a real <img> later */
.ph { display: grid; place-items: center; text-align: center; padding: var(--space-2); min-height: 140px; background: #D9CFC0; color: var(--muted); border: 2px dashed #A99C8A; border-radius: var(--radius); font-weight: 500; }
.ph--hero { aspect-ratio: 4 / 5; }
.ph--story { aspect-ratio: 4 / 3; }
.dark .ph { background: #33281F; color: #CBBBA6; border-color: #5A4A3B; }

/* Marquee, iconic plates, favourites */
.marquee { background: var(--saffron); color: var(--espresso); overflow: hidden; direction: ltr; padding-block: 1.1rem; }
.marquee__track { display: flex; width: max-content; animation: slide 40s linear infinite; }
.marquee:hover .marquee__track { animation-play-state: paused; }
.marquee span { font-family: var(--font-head); font-style: italic; font-size: 1.5rem; white-space: nowrap; }
.marquee span::after { content: "✦"; font-style: normal; font-size: .8em; margin-inline: 1.6rem; opacity: .5; }
html[lang="ar"] .marquee span { font-style: normal; }
.head { max-width: 40rem; margin-block-end: var(--space-3); }
.head .lead { margin: 0; opacity: .8; }
.row { display: flex; gap: var(--space-3); overflow-x: auto; scroll-snap-type: x mandatory; padding-block: var(--space-2); scrollbar-width: thin; scrollbar-color: var(--saffron) transparent; }
.tile { position: relative; flex: 0 0 min(70vw, 250px); aspect-ratio: 3 / 4; scroll-snap-align: start; border-radius: var(--radius); overflow: hidden; }
.tile .ph { position: absolute; inset: 0; min-height: 0; border: 0; border-radius: 0; background: linear-gradient(160deg, #3A2C22, #241A14); transition: transform 1s var(--ease); }
.tile:hover .ph { transform: scale(1.07); }
.tile__cap { position: absolute; inset: auto 0 0; padding: 3.5rem 1.1rem 1.1rem; background: linear-gradient(transparent, rgba(18,12,9,.94)); }
.tile__cap h3 { margin: 0 0 .2rem; font-size: 1.2rem; }
.tile__cap p { margin: 0; font-size: .85rem; color: var(--saffron); }
.favs { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-2); margin: 0; }
.dark .card { background: #2A201A; border-color: #3D3028; }
.fav { padding: 0; overflow: hidden; transition: transform .45s var(--ease), box-shadow .45s; }
.fav:hover { transform: translateY(-5px); box-shadow: 0 20px 36px -20px rgba(27,20,16,.4); }
.fav .ph { border: 0; border-radius: 0; aspect-ratio: 4 / 3; }
.fav__body { padding: var(--space-2) var(--space-3) var(--space-3); }
.fav__body p { margin: 0 0 .4rem; }
.tag { color: var(--saffron-text); font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.price { font-weight: 700; color: var(--terracotta); }
.pull { margin: var(--space-3) 0 0; padding-inline-start: var(--space-2); border-inline-start: 3px solid var(--saffron); font-family: var(--font-head); font-style: italic; font-size: var(--text-l); color: var(--muted); }
html[lang="ar"] .pull { font-style: normal; }

/* Menu categories */
.cats { display: grid; gap: var(--space-2); grid-template-columns: 1fr 1fr; }
.cat { display: flex; align-items: center; min-height: 96px; padding: var(--space-2) var(--space-3); border: 2px solid var(--espresso); border-radius: var(--radius-sm); font-family: var(--font-head); font-size: var(--text-l); font-weight: 600; text-decoration: none; }
.cat:hover { background: var(--saffron); border-color: var(--saffron); }
@media (min-width: 768px) { .cats { grid-template-columns: repeat(3, 1fr); } }

/* The room */
.room { display: grid; gap: var(--space-2); grid-template-columns: 1fr 1fr; }
.room .ph { aspect-ratio: 1; }
.room .ph:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
@media (min-width: 768px) {
  .room { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
  .room .ph, .room .ph:first-child { aspect-ratio: auto; min-height: 200px; }
  .room .ph:first-child { grid-column: auto; grid-row: 1 / 3; }
}

/* Reviews */
.note { color: var(--terracotta); font-weight: 700; font-size: .95rem; }
.reviews { display: grid; gap: var(--space-3); }
.reviews p { margin: 0 0 var(--space-2); }
.reviews footer { color: var(--muted); font-size: .95rem; }
@media (min-width: 768px) { .reviews { grid-template-columns: repeat(3, 1fr); } }

/* Visit */
.hours { margin: 0 0 var(--space-3); }
.hours div { display: flex; justify-content: space-between; gap: var(--space-2); padding-block: .4rem; border-block-end: 1px solid #3D3028; }
.hours dt, .hours dd { margin: 0; }
.time { direction: ltr; }
.info h3 { margin-block-start: var(--space-3); }
.info p { margin: 0; }

/* Footer */
.footer { padding-block: var(--space-4); border-block-start: 1px solid #3D3028; }
.foot { display: grid; gap: var(--space-2); }
.copy { margin: 0; color: #CBBBA6; font-size: .9rem; }
@media (min-width: 768px) { .foot { grid-template-columns: 1fr auto auto; align-items: center; } .copy { grid-column: 1 / -1; } }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } .reveal { opacity: 1; } }

/* Illustrated art + menu explorer */
.ph--art { position: relative; padding: 0; border: 0; overflow: hidden; background: #1B1410; display: block; }
.ph--art svg, .ph--art img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
button.cat { font-family: var(--font-head); font-size: var(--text-l); font-weight: 600; background: none; color: inherit; text-align: start; cursor: pointer; width: 100%; transition: background .3s, color .3s, border-color .3s; }
.cat.active, .cat.active:hover { background: var(--espresso); border-color: var(--espresso); color: var(--saffron); }
.menu-panel { margin-block-start: var(--space-4); padding: var(--space-3); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
.mp-title { font-size: var(--text-h2); margin-block-end: var(--space-1); }
.mi { display: grid; grid-template-columns: 1fr auto; gap: .15rem 1rem; align-items: baseline; padding-block: 1rem; border-block-end: 1px dashed var(--line); animation: rise .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
.mi h3 { margin: 0; font-size: 1.15rem; }
.mi p { grid-column: 1 / -1; margin: 0; color: var(--muted); }
.menu-panel .btns { margin-block-start: var(--space-3); }
/* Booking window */
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.98); } }
@keyframes fade { from { opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.booking { border: 0; padding: 0; background: none; color: var(--espresso); width: min(100% - 1.5rem, 640px); max-width: none; overflow: visible; }
.booking[open] { animation: pop .5s var(--ease); }
.booking::backdrop { background: rgba(18,12,9,.74); backdrop-filter: blur(6px); }
.booking[open]::backdrop { animation: fade .4s; }
.bk { display: flex; flex-direction: column; max-height: min(92dvh, 780px); background: var(--cream); border-radius: 22px; overflow: hidden; box-shadow: 0 40px 90px -30px #000; }
.bk__head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.5rem; background: var(--espresso); color: var(--cream); }
.bk__head h2 { margin: 0; font-size: 1.6rem; }
.bk__head p { margin: 0; color: var(--saffron); font-size: .9rem; }
.bk__head :focus-visible { outline-color: var(--saffron); }
.bk__x { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid rgba(246,239,228,.3); background: none; color: inherit; font-size: 1.4rem; line-height: 1; cursor: pointer; transition: border-color .3s, color .3s; }
.bk__x:hover { border-color: var(--saffron); color: var(--saffron); }
.bk__steps { display: flex; gap: .5rem; list-style: none; margin: 0; padding: .9rem 1.5rem; background: var(--tint); }
.bk__steps li { flex: 1; padding-block-start: .45rem; border-block-start: 3px solid var(--line); font-size: .8rem; color: var(--muted); }
.bk__steps .done { border-color: var(--saffron-text); }
.bk__steps .on { border-color: var(--saffron); color: var(--espresso); font-weight: 700; }
.bk__body { overflow-y: auto; padding: 1.5rem 1.5rem 0; }
.bk__body.in { animation: rise .6s var(--ease) backwards; }
.bk h3 { margin: 1.5rem 0 .6rem; font-size: 1.1rem; }
.bk__body > h3:first-child { margin-block-start: 0; }
.bk__note { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { min-width: 3rem; padding: .5rem .9rem; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); color: inherit; font: inherit; font-weight: 600; text-align: center; cursor: pointer; transition: border-color .25s, background .25s, color .25s; }
.chip:hover:not(:disabled) { border-color: var(--saffron); }
.chip.on { background: var(--espresso); border-color: var(--espresso); color: var(--saffron); }
.chip:disabled { opacity: .3; cursor: default; }
.chip.ltr { direction: ltr; }
.cal__bar { display: flex; align-items: center; justify-content: space-between; margin-block-end: .6rem; }
.cal__bar .chip { padding: .2rem .9rem; font-size: 1.3rem; line-height: 1.2; }
html[dir="rtl"] .cal__bar .chip { transform: scaleX(-1); }
.cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal__wd { font-size: .75rem; color: var(--muted); padding-block-end: .3rem; }
.day { aspect-ratio: 1; border: 0; border-radius: 50%; background: none; color: inherit; font: inherit; cursor: pointer; transition: background .2s; }
.day:hover:not(:disabled) { background: var(--tint); }
.day.today { box-shadow: inset 0 0 0 2px var(--saffron); }
.day.on, .day.on:hover { background: var(--saffron); font-weight: 700; }
.day:disabled { opacity: .3; cursor: default; }
.bk__foot { position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 1rem; margin-block-start: 1.5rem; padding-block: 1rem 1.25rem; background: var(--cream); border-block-start: 1px solid var(--line); }
.bk .btn--ghost:hover { color: var(--terracotta); border-color: var(--terracotta); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.sum { display: flex; flex-wrap: wrap; gap: .5rem 1.75rem; padding: 1rem 1.25rem; margin-block-end: 1.25rem; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.sum small { display: block; color: var(--muted); font-size: .75rem; }
.field { display: grid; gap: .35rem; margin-block-end: 1rem; }
.field span { font-size: .85rem; font-weight: 600; }

.field input:focus, .field textarea:focus { outline: none; border-color: var(--saffron); box-shadow: 0 0 0 3px rgba(242,169,0,.3); }
.ok { display: grid; justify-items: center; text-align: center; gap: .5rem; padding-block-end: .5rem; }
.ok h3 { margin: .5rem 0 0; font-size: 1.5rem; }
.ok p { margin: 0 0 1rem; color: var(--muted); }
.ok-c { stroke-dasharray: 214; stroke-dashoffset: 214; animation: draw .9s var(--ease) .1s forwards; }
.ok-t { stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .6s var(--ease) .8s forwards; }
@media (prefers-reduced-motion: reduce) { .ok-c, .ok-t { stroke-dashoffset: 0; } }
/* Hero: forming headline + aura */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(1.16); opacity: .65; } }
@keyframes form { from { opacity: 0; filter: blur(12px); transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.7); } 55% { opacity: 1; } }
@keyframes glow { 50% { text-shadow: 0 0 30px rgba(242,169,0,.7), 0 0 80px rgba(242,169,0,.35); } }
@keyframes dust { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: .95; } 100% { transform: translate(var(--dx), -105vh); opacity: 0; } }
@keyframes float { 50% { transform: translateY(-14px) rotate(1.5deg); } }
@keyframes swap { from { opacity: 0; filter: blur(8px); transform: scale(.82) translateY(20px); } }
.hero h1 { text-shadow: 0 0 40px rgba(242,169,0,.14); }
.hero h1 .w { display: inline-block; white-space: nowrap; }
.hero h1 .ch { display: inline-block; animation: form 1.2s var(--ease) backwards; animation-delay: calc(var(--d) * 1ms); }
.hero h1 em { animation: glow 5s ease-in-out 3.2s infinite; }
.hero__aura { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.hero__aura::before, .hero__aura::after { content: ""; grid-area: 1 / 1; aspect-ratio: 1; }
.hero__aura::before { width: min(115vmin, 1150px); background: conic-gradient(from 0deg, transparent 0 8%, rgba(242,169,0,.26) 13%, transparent 21% 38%, rgba(196,98,45,.24) 45%, transparent 53% 70%, rgba(255,214,112,.22) 77%, transparent 86%); -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 68%); mask-image: radial-gradient(circle, #000 15%, transparent 68%); filter: blur(28px); animation: spin 50s linear infinite; }
.hero__aura::after { width: min(75vmin, 760px); border-radius: 50%; background: radial-gradient(circle, rgba(255,200,80,.32), rgba(242,169,0,.09) 45%, transparent 70%); animation: breathe 7s ease-in-out infinite; }
.hero__dust { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.hero__dust i { position: absolute; bottom: -10px; inset-inline-start: var(--l); width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, #FFD770, rgba(242,169,0,0) 70%); opacity: 0; animation: dust var(--t) linear var(--w) infinite; }

/* Menu: transparent stage for cut-out food */
.menu-layout { display: grid; gap: var(--space-3); align-items: center; margin-block-start: var(--space-4); }
.menu-panel { margin-block-start: 0; }
.stage { position: relative; display: grid; place-items: center; min-height: 290px; order: -1; }
.stage::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(circle, rgba(242,169,0,.5), rgba(242,169,0,.14) 50%, transparent 70%); filter: blur(10px); animation: breathe 6s ease-in-out infinite; }
.stage::after { content: ""; position: absolute; inset: 12%; border-radius: 50%; border: 1px dashed rgba(166,104,0,.55); animation: spin 70s linear infinite; }

// Turns "Hello *world*" into: Hello <em class="accent">world</em>
function setRich(el, text) {
  const parts = text.split("*").map((part, i) =>
    i % 2 ? h("em", "accent", part) : document.createTextNode(part)
  );
  el.replaceChildren(...parts);
}

function applyText() {
  document.querySelectorAll("[data-i18n]").forEach((el) => setRich(el, t(el.dataset.i18n)));
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-config]").forEach((el) => (el.textContent = CONFIG[el.dataset.config]));
  document.title = t("meta.title");
}

function fill(id, items, build) {
  document.getElementById(id).replaceChildren(...items.map(build));
}

  lang = next;

  applyText();

  observeReveal();
  renderBooking();
}

// Scroll reveal: each element eases in once, staggered by its position among siblings.
const io = "IntersectionObserver" in window
  ? new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
    }), { threshold: 0.12 })
  : null;

function observeReveal() {
  document.querySelectorAll(".reveal:not(.is-in)").forEach((el) => {
    el.style.setProperty("--i", Math.min([...el.parentNode.children].indexOf(el), 5));
    io ? io.observe(el) : el.classList.add("is-in");
  });
}

  onScroll();
  const setOpen = (open) => {
    drawer.classList.toggle("open", open);
    burger.classList.toggle("is-open", open);
    burger.setAttribute("aria-expanded", String(open));
    drawer.inert = !open;
    document.body.style.overflow = open ? "hidden" : "";
  };
  setOpen(false);
  drawer.querySelectorAll("a").forEach((a, i) => a.style.setProperty("--i", i));
  burger.addEventListener("click", () => setOpen(!drawer.classList.contains("open")));
  drawer.addEventListener("click", (e) => { if (e.target.closest("a")) setOpen(false); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
}

// ---- Booking window: guests, date and time, then details, then a WhatsApp request ----
const bk = { step: 1, guests: 0, large: false, month: null, date: null, time: "", name: "", phone: "", email: "", notes: "" };
const loc = () => (lang === "ar" ? "ar-EG" : "en-GB");
const num = (n) => n.toLocaleString(loc());
const day0 = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const hm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const fmt = (str, o) => str.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const fmtDate = (d) => d.toLocaleDateString(loc(), { weekday: "short", day: "numeric", month: "short" });

function slotsFor(date) {
  const B = CONFIG.booking, [open, close] = B.hours[date.getDay()];
  const now = new Date(), isToday = day0(now).getTime() === date.getTime(), earliest = now.getHours() * 60 + now.getMinutes() + 60;
  const out = [];
  for (let m = open * 60; m <= close * 60 - B.lastSeatingBeforeClose; m += 30) if (!isToday || m > earliest) out.push(hm(m));
  return out;
}

function chip(label, on, onClick, extra = "") {
  const b = h("button", "chip " + extra + (on ? " on" : ""), label);
  b.type = "button";
  b.setAttribute("aria-pressed", String(on));
  b.addEventListener("click", onClick);
  return b;
}

function foot(onBack, label, disabled, onNext, submit) {
  const f = h("div", "bk__foot");
  if (onBack) {
    const back = h("button", "btn btn--ghost", t("bk.back"));
    back.type = "button";
    back.addEventListener("click", onBack);
    f.append(back);
  } else f.append(h("span"));
  const next = h("button", "btn btn--primary", label);
  next.type = submit ? "submit" : "button";
  next.disabled = !!disabled;
  if (onNext) next.addEventListener("click", onNext);
  f.append(next);
  return f;
}

function goStep(step) {
  bk.step = step;
  const body = document.getElementById("bk-body");
  body.classList.remove("in");
  renderBooking();
  body.scrollTop = 0;
  void body.offsetWidth;
  body.classList.add("in");
}

function bkTable() {
  const B = CONFIG.booking, today = day0(new Date());
  if (!bk.month) bk.month = new Date(today.getFullYear(), today.getMonth(), 1);
  const first = bk.month, last = new Date(today);
  last.setDate(last.getDate() + B.daysAhead);
  const nodes = [h("h3", "", t("bk.qGuests"))];

  const guests = h("div", "chips");
  for (let n = 1; n <= B.maxGuests; n++) guests.append(chip(num(n), bk.guests === n, () => { bk.guests = n; bk.large = false; renderBooking(); }));
  guests.append(chip(t("bk.large"), bk.large, () => { bk.large = true; bk.guests = 0; renderBooking(); }));
  nodes.push(guests);
  if (bk.large) {
    const note = h("p", "bk__note", t("bk.largeNote") + " ");
    const call = h("a", "", CONFIG.phone);
    call.href = CONFIG.phoneLink;
    call.dir = "ltr";
    note.append(call);
    nodes.push(note);
  }

  nodes.push(h("h3", "", t("bk.qDate")));
  const bar = h("div", "cal__bar");
  const prev = h("button", "chip", "‹");
  prev.type = "button";
  prev.disabled = first <= new Date(today.getFullYear(), today.getMonth(), 1);
  prev.setAttribute("aria-label", t("bk.prev"));
  prev.addEventListener("click", () => { bk.month = new Date(first.getFullYear(), first.getMonth() - 1, 1); renderBooking(); });
  const next = h("button", "chip", "›");
  next.type = "button";
  next.disabled = new Date(first.getFullYear(), first.getMonth() + 1, 1) > last;
  next.setAttribute("aria-label", t("bk.nxt"));
  next.addEventListener("click", () => { bk.month = new Date(first.getFullYear(), first.getMonth() + 1, 1); renderBooking(); });
  bar.append(prev, h("strong", "", first.toLocaleDateString(loc(), { month: "long", year: "numeric" })), next);

  const grid = h("div", "cal__grid");
  for (let i = 0; i < 7; i++) grid.append(h("span", "cal__wd", new Date(2023, 0, 1 + i).toLocaleDateString(loc(), { weekday: "short" })));
  for (let i = 0; i < first.getDay(); i++) grid.append(h("span"));
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const date = new Date(first.getFullYear(), first.getMonth(), d);
    const b = h("button", "day", num(d));
    b.type = "button";
    b.disabled = date < today || date > last;
    if (date.getTime() === today.getTime()) b.classList.add("today");
    if (bk.date && bk.date.getTime() === date.getTime()) b.classList.add("on");
    b.addEventListener("click", () => { bk.date = date; bk.time = ""; renderBooking(); });
    grid.append(b);
  }
  nodes.push(bar, grid, h("h3", "", t("bk.qTime")));

  if (!bk.date) nodes.push(h("p", "bk__note", t("bk.pickDate")));
  else {
    const slots = slotsFor(bk.date);
    if (!slots.length) nodes.push(h("p", "bk__note", t("bk.noTimes")));
    else {
      const wrap = h("div", "chips");
      slots.forEach((x) => wrap.append(chip(x, bk.time === x, () => { bk.time = x; renderBooking(); }, "ltr")));
      nodes.push(wrap);
    }
  }
  nodes.push(foot(null, t("bk.next"), !(bk.guests && bk.date && bk.time), () => goStep(2)));
  return nodes;
}

function summary() {
  const box = h("div", "sum");
  [["bk.lGuests", num(bk.guests)], ["bk.lDate", fmtDate(bk.date)], ["bk.lTime", bk.time]].forEach(([k, v]) => {
    const item = h("div");
    item.append(h("small", "", t(k)), h("strong", "", v));
    box.append(item);
  });
  return box;
}

function field(key, name, type, required) {
  const label = h("label", "field");
  const input = h(type === "textarea" ? "textarea" : "input");
  input.name = name;
  input.required = required;
  input.value = bk[name];
  if (type === "textarea") input.rows = 3;
  else input.type = type;
  if (type === "tel") { input.dir = "ltr"; input.minLength = 7; input.autocomplete = "tel"; }
  if (type === "email") input.dir = "ltr";
  if (name === "name") input.autocomplete = "name";
  input.addEventListener("input", () => (bk[name] = input.value));
  label.append(h("span", "", t(key)), input);
  return label;
}

function bkDetails() {
  const form = h("form");
  form.append(
    summary(),
    field("bk.name", "name", "text", true),
    field("bk.phone", "phone", "tel", true),
    field("bk.email", "email", "email", false),
    field("bk.notes", "notes", "textarea", false),
    foot(() => goStep(1), t("bk.confirm"), false, null, true)
  );
  form.addEventListener("submit", (e) => { e.preventDefault(); goStep(3); });
  return [form];
}

function bkDone() {
  const msg = fmt(t("bk.msg"), {
    n: bk.guests, date: fmtDate(bk.date), time: bk.time, name: bk.name, phone: bk.phone,
    notes: bk.notes ? ` ${t("bk.notesLabel")}: ${bk.notes}` : "",
  });
  const ok = h("div", "ok");
  ok.innerHTML = '<svg viewBox="0 0 80 80" width="76" height="76" aria-hidden="true"><circle class="ok-c" cx="40" cy="40" r="34" fill="none" stroke="#F2A900" stroke-width="4"/><path class="ok-t" d="M25 41l11 11 20-23" fill="none" stroke="#F2A900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  ok.append(h("h3", "", t("bk.doneTitle")), h("p", "", t("bk.doneText")));
  const send = h("a", "btn btn--primary", t("bk.send"));
  send.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  send.target = "_blank";
  send.rel = "noopener";
  const done = foot(null, t("bk.send"), false);
  done.replaceChildren(h("span"), send);
  const finish = h("button", "btn btn--ghost", t("bk.finish"));
  finish.type = "button";
  finish.addEventListener("click", () => document.getElementById("booking").close());
  done.prepend(finish);
  return [ok, summary(), done];
}

function renderBooking() {
  const body = document.getElementById("bk-body");
  const y = body.scrollTop;
  document.getElementById("bk-steps").replaceChildren(...["bk.s1", "bk.s2", "bk.s3"].map((k, i) => h("li", i + 1 === bk.step ? "on" : i + 1 < bk.step ? "done" : "", t(k))));
  body.replaceChildren(...[bkTable, bkDetails, bkDone][bk.step - 1]());
  body.scrollTop = y;
}

function openBooking() {
  const burger = document.getElementById("burger");
  if (burger.getAttribute("aria-expanded") === "true") burger.click();
  if (bk.step === 3) Object.assign(bk, { step: 1, guests: 0, large: false, date: null, time: "", notes: "" });
  renderBooking();
  document.getElementById("booking").showModal();
  document.body.style.overflow = "hidden";
}

function initBooking() {
  const dlg = document.getElementById("booking");
  dlg.addEventListener("close", () => (document.body.style.overflow = ""));
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  document.getElementById("bk-close").addEventListener("click", () => dlg.close());
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href="#reserve"]');
    if (a) { e.preventDefault(); openBooking(); }
  });
}

// Splits the headline into letters (words for Arabic) that fly in and assemble.
function formHero() {
  const h1 = document.querySelector(".hero h1");
  h1.setAttribute("aria-label", h1.textContent);
  const letters = lang !== "ar";
  let n = 0;
  const wrap = (text) => {
    const frag = document.createDocumentFragment();
    text.split(/(\s+)/).forEach((part) => {
      if (!part.trim()) return frag.append(part);
      const w = h("span", "w");
      w.setAttribute("aria-hidden", "true");
      (letters ? [...part] : [part]).forEach((c) => {
        const ch = h("span", "ch", c);
        ch.style.setProperty("--x", ((Math.random() - 0.5) * 220).toFixed(0) + "px");
        ch.style.setProperty("--y", ((Math.random() - 0.5) * 160 - 30).toFixed(0) + "px");
        ch.style.setProperty("--r", ((Math.random() - 0.5) * 80).toFixed(0) + "deg");
        ch.style.setProperty("--d", 450 + n++ * (letters ? 38 : 160));
        w.append(ch);
      });
      frag.append(w);
    });
    return frag;
  };
  [...h1.childNodes].forEach((node) => {
    if (node.nodeType === 3) node.replaceWith(wrap(node.textContent));
    else node.replaceChildren(wrap(node.textContent));
  });
}

// Floating gold dust in the hero.
function initDust() {
  const box = document.getElementById("dust");
  for (let i = 0; i < 24; i++) {
    const p = document.createElement("i");
    p.style.cssText = `--l:${(Math.random() * 100).toFixed(1)}%;--s:${(Math.random() * 5 + 3).toFixed(1)}px;--t:${(Math.random() * 10 + 9).toFixed(1)}s;--w:${(-Math.random() * 16).toFixed(1)}s;--dx:${((Math.random() - 0.5) * 140).toFixed(0)}px`;
    box.append(p);
  }
}

function init() {
  document.querySelectorAll("[data-href]").forEach((a) => (a.href = a.dataset.href.split(".").reduce((o, k) => o[k], CONFIG)));
  document.querySelectorAll("[data-art]").forEach((b) => paint(b, b.dataset.art));
  let saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  setLang(saved === "ar" ? "ar" : "en");
  document.querySelectorAll("[data-lang-toggle]").forEach((b) => b.addEventListener("click", () => setLang(lang === "en" ? "ar" : "en")));
  initUI();
  initBooking();
  initDust();
}

init();

</script>
